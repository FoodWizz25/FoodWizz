<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up to InsideBox</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>

    <style>
        /* --- RESET Y CONFIGURACIÓN GENERAL --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f7f7f7;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .signup-container {
            display: flex;
            width: 1000px;
            max-width: 90%;
            min-height: 600px;
            background-color: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        /* --- COLUMNA IZQUIERDA (FORMULARIO) --- */
        .form-section {
            flex: 1;
            padding: 50px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-weight: 700;
            font-size: 24px;
            color: #1a202c;
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            display: inline-block;
            width: 30px;
            height: 30px;
            background-color: #3b82f6;
            margin-right: 10px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        .form-header p {
            color: #718096;
            margin-bottom: 5px;
        }

        .form-header h1 {
            font-size: 28px;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 30px;
        }

        /* --- ESTILOS DEL FORMULARIO --- */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #4a5568;
            margin-bottom: 8px;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .form-group .input-icon {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            color: #a0aec0;
            cursor: pointer;
        }

        /* --- BOTONES --- */
        .signup-btn {
            width: 100%;
            padding: 15px;
            background-color: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .signup-btn:hover {
            background-color: #2563eb;
        }

        /* --- DIVISOR Y LOGIN SOCIAL --- */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #a0aec0;
            margin: 30px 0;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }

        .divider:not(:empty)::before {
            margin-right: .5em;
        }

        .divider:not(:empty)::after {
            margin-left: .5em;
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .social-btn:hover {
            background-color: #f7fafc;
            border-color: #cbd5e0;
        }

        .social-btn i {
            font-size: 24px;
            color: #4a5568;
        }
        
        /* --- LINK INFERIOR --- */
        .signin-link {
            text-align: center;
            margin-top: auto; /* Empuja al final */
            padding-top: 20px;
            font-size: 14px;
        }

        .signin-link a {
            color: #3b82f6;
            font-weight: 600;
            text-decoration: none;
        }
        
        .signin-link a:hover {
            text-decoration: underline;
        }

        /* --- COLUMNA DERECHA (IMAGEN) --- */
        .image-section {
            flex: 1;
            background-image: url('https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?q=80&w=1887&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 900px) {
            .image-section {
                display: none; /* Oculta la imagen en pantallas pequeñas */
            }
            .signup-container {
                width: 100%;
                max-width: 450px;
            }
            .form-section {
                padding: 40px;
            }
        }

    </style>
</head>
<body>

    <main class="signup-container">
        <div class="form-section">
            <div class="logo">
                <span class="logo-icon"></span>
                InsideBox
            </div>

            <div class="form-header">
                <p>Start your journey</p>
                <h1>Sign Up to InsideBox</h1>
            </div>

            <form>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="example@email.com" required>
                        <i class="ri-mail-line input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <i class="ri-eye-off-line input-icon" id="password-toggle"></i>
                    </div>
                </div>

                <button type="submit" class="signup-btn">Sign Up</button>
            </form>

            <div class="divider">or sign up with</div>

            <div class="social-login">
                <a href="#" class="social-btn" aria-label="Sign up with Facebook">
                    <i class="ri-facebook-fill"></i>
                </a>
                <a href="#" class="social-btn" aria-label="Sign up with Google">
                    <i class="ri-google-fill"></i>
                </a>
                <a href="#" class="social-btn" aria-label="Sign up with Apple">
                    <i class="ri-apple-fill"></i>
                </a>
            </div>
            
            <p class="signin-link">
                Have an account? <a href="#">Sign in</a>
            </p>

        </div>

        <div class="image-section"></div>
    </main>

    <script>
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('password-toggle');

        passwordToggle.addEventListener('click', () => {
            // Revisa el tipo de input actual
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            // Cambia el icono del ojo
            if (type === 'password') {
                passwordToggle.classList.remove('ri-eye-line');
                passwordToggle.classList.add('ri-eye-off-line');
            } else {
                passwordToggle.classList.remove('ri-eye-off-line');
                passwordToggle.classList.add('ri-eye-line');
            }
        });
    </script>

</body>
</html>
